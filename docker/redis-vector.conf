# Config for the Redis 8 vector store (docker-compose.redis-vector.yml). No secrets here:
# the password is passed on the command line from REDIS_VECTOR_PASSWORD in .env.
appendonly yes
maxmemory 256mb
# NOT allkeys-lru like a cache: a vector store must never silently evict embeddings.
# When memory is full, writes fail loudly instead.
maxmemory-policy noeviction
